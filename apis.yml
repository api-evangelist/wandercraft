aid: wandercraft
name: Wandercraft
description: 'Wandercraft is a robotics company founded in 2012 by Nicolas Simon, Matthieu
  Masselin and Jean-Louis Constanza, dual-headquartered in Paris and New York with 175+
  AI, robotics and industrial staff. It designs, manufactures and sells self-balancing
  robotic exoskeletons and humanoid robots. Atalante X is a hands-free, self-balancing
  overground rehabilitation exoskeleton with 12 motors, used in more than 100 rehabilitation
  and research centers, CE-marked in 2019 and FDA-cleared for stroke (2022), spinal cord
  injury (2024) and multiple sclerosis (2025). Eve is the personal self-balancing exoskeleton
  for wheelchair users, FDA-cleared and commercially launching in the United States in 2026.
  Calvin-40 is the industrial humanoid built on the same full-body control stack for part
  handling, flow logistics, picking and kitting in factories and warehouses, deployed at
  Renault''s Douai plant. Renault Group took a stake and joined as industrial partner
  alongside the June 2025 Series D. Wandercraft publishes no public API, developer portal,
  SDK or machine-readable contract of any kind: the product is regulated medical-device and
  industrial hardware, its control software is embedded in the device, and its only public
  code surface is a single maintenance fork of a third-party C library on GitHub.'
